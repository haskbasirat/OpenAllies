[package]
name = "aa-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MPL-2.0"

# Presentation experiment: draws the original map, models and animation rigs
# with Bevy so the engine can be judged. No gameplay runs in this binary.
[[bin]]
name = "AxisAlliesBevy"
path = "src/main.rs"

[dependencies]
aa-assets = { path = "../aa-assets" }
aa-animation = { path = "../aa-animation" }
aa-play = { path = "../aa-play" }
# The original UI engine (TGI layouts, widgets, draw lists): menus and HUD.
aa-ui = { path = "../aa-ui" }
# Scenario map headers for the staging map list and preview.
aa-mapworld = { path = "../aa-mapworld" }
# Embedded NIF images (health / morale bar frames).
aa-formats = { path = "../aa-formats" }
ab_glyph = "0.2"
anyhow = "1"
bevy = "=0.19.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Effects and sound (effects/, audio/): the original FX/VFX/Audio
# definitions through the rules catalog aa-play uses, and MP3 decoding of
# the original music and speech through Bevy's own rodio.
aa-rules = { path = "../aa-rules" }
aa-numeric = { path = "../aa-numeric" }
rodio = { version = "0.22", default-features = false, features = ["mp3"] }
# The World War II campaign (campaign/): the ported metagame rules and its
# single-player driver.
aa-metagame = { path = "../aa-metagame" }
# The film reader and player (research/byte-exact/FILM-PLAYBACK.md): the film
# dialog, the film session and the tick driver.
aa-parity = { path = "../aa-parity", features = ["play"] }
# LAN multiplayer (net/): the original's session layer.
aa-netcode = { path = "../aa-netcode" }
aa-orders = { path = "../aa-orders" }
aa-runtime = { path = "../aa-runtime" }
aa-simulation = { path = "../aa-simulation" }
# Online play through Epic Online Services (net/eos.rs). Its library is found at
# run time, so nothing of Epic's but the bindings is needed to build.
aa-eos = { path = "../aa-eos", optional = true }

[features]
# The Internet button. Without it LAN and a direct address work as ever, and
# a release needs no Epic file beside the program.
eos = ["dep:aa-eos"]

# A separate workspace on purpose: Bevy's naga_oil enables codespan-reporting's
# termcolor feature, which breaks the wgpu-27 naga the client builds when both
# are compiled in one workspace. Keeping Bevy apart leaves the client unchanged.
[workspace]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
