[workspace]
members = ["crates/aa-assets", "crates/aa-animation", "crates/aa-economy", "crates/aa-world", "crates/aa-orders", "crates/aa-actors", "crates/aa-movement", "crates/aa-numeric", "crates/aa-body", "crates/aa-trig", "crates/aa-navigation", "crates/aa-spatial", "crates/aa-heightfield", "crates/aa-formats", "crates/aa-simulation", "crates/aa-transfer", "crates/aa-resources", "crates/aa-rules", "crates/aa-client", "crates/aa-mapworld", "crates/aa-production", "crates/aa-combat", "crates/aa-mind", "crates/aa-runtime", "crates/aa-triggers", "crates/aa-ui", "crates/aa-metagame", "crates/aa-netcode", "crates/aa-zones", "crates/aa-play", "crates/aa-parity"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
